<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>Watch - StreamFlix</title>
    <link rel="stylesheet" href="/frontend/styles.css">
    <link rel="stylesheet" href="/frontend/watch.css">
</head>
<body class="watch-body">
    <header class="watch-topbar">
        <a class="brand" href="/" aria-label="StreamFlix home">
            <span class="brand-mark">S</span>
            <span>StreamFlix</span>
        </a>
        <a class="watch-home" href="/">Back to library</a>
    </header>

    <main class="watch-layout">
        <section class="player-column">
            <div class="cinema-player" id="cinema-player">
                <video id="movie-player" preload="metadata" playsinline>
                    Your browser does not support HTML5 video.
                </video>
                <button class="center-play" id="center-play" type="button" aria-label="Play">&#9654;</button>
                <div class="player-controls" id="player-controls">
                    <div class="progress-area" id="progress-area">
                        <div class="progress-track"><span id="progress-buffer"></span><span id="progress-played"></span></div>
                    </div>
                    <div class="control-row">
                        <button class="control-button" id="play-toggle" type="button" aria-label="Play">&#9654;</button>
                        <button class="control-button" id="rewind" type="button" aria-label="Rewind 10 seconds">&#8634;10</button>
                        <button class="control-button" id="forward" type="button" aria-label="Forward 10 seconds">10&#8635;</button>
                        <label class="volume-control" aria-label="Volume">
                            <span id="volume-icon">&#128266;</span>
                            <input id="volume" type="range" min="0" max="1" step="0.05" value="1">
                        </label>
                        <span class="time-readout"><span id="current-time">0:00</span> / <span id="duration">0:00</span></span>
                        <div class="control-spacer"></div>
                        <select class="speed-select" id="speed-select" aria-label="Playback speed">
                            <option value="0.5">0.5x</option>
                            <option value="0.75">0.75x</option>
                            <option value="1" selected>Normal</option>
                            <option value="1.25">1.25x</option>
                            <option value="1.5">1.5x</option>
                            <option value="2">2x</option>
                        </select>
                        <button class="control-button" id="picture-in-picture" type="button" aria-label="Picture in picture">&#9633;</button>
                        <button class="control-button" id="theater-mode" type="button" aria-label="Theater mode">&#9636;</button>
                        <button class="control-button" id="fullscreen" type="button" aria-label="Fullscreen">&#9974;</button>
                    </div>
                </div>
            </div>
            <div class="watch-details">
                <p class="eyebrow">Movie</p>
                <h1 id="watch-title">Loading movie...</h1>
                <p id="watch-description">Preparing playback.</p>
                <div class="watch-actions">
                    <button class="primary-button" id="watch-download" type="button">Download movie</button>
                    <button class="secondary-button" id="watch-copy" type="button">Copy link</button>
                </div>
            </div>
        </section>
    </main>

    <script src="/frontend/watch.js"></script>
</body>
</html>
